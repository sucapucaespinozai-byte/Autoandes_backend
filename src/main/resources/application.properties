spring.application.name=autoandes-backend
spring.config.import=optional:file:./.local/application.properties
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1524/FREEPDB1}
spring.datasource.username=${DB_USERNAME:AUTOANDES}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
app.cors.origins=${FRONTEND_ORIGINS:http://localhost:4200}
logging.file.name=logs/autoandes.log
